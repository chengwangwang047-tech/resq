# Shared settings. Select dev, test or prod explicitly at startup.
# Connection endpoints and credentials belong to the selected profile.

# Application
spring.application.name=resq
server.port=8080

# Database initialization (schema managed separately)
spring.sql.init.mode=never

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml

# JWT lifetime (secret is supplied per profile)
resq.jwt.expiration-seconds=3600

# Redis timeout
spring.data.redis.timeout=3s

# Existing application logging
logging.level.com.resq.cache=DEBUG
logging.level.com.resq.service.ResourceService=DEBUG

# RabbitMQ acknowledgement
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Reservation rate limit
resq.rate-limit.reservation-per-minute=10

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
