# WSL JAR -> Docker services published on the loopback interface.
# Credentials must be exported through the existing RESQ_* variables.

spring.datasource.url=${RESQ_DB_URL:jdbc:mysql://127.0.0.1:3306/resq?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
spring.datasource.username=${RESQ_DB_USERNAME}
spring.datasource.password=${RESQ_DB_PASSWORD}

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RESQ_RABBITMQ_USERNAME}
spring.rabbitmq.password=${RESQ_RABBITMQ_PASSWORD}

resq.jwt.secret-base64=${RESQ_JWT_SECRET_BASE64}
