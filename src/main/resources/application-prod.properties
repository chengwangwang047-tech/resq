# PROD deployment template; provision separate services and credentials.
# All file placeholders are required; no fallback to dev values is configured.
# Launch with env -u RESQ_JWT_SECRET_BASE64 to remove the dev JWT override.
# Spring gives direct environment/JVM/CLI property overrides higher precedence.
# DB_URL must be a complete JDBC URL for this environment.

spring.datasource.url=${RESQ_PROD_DB_URL}
spring.datasource.username=${RESQ_PROD_DB_USERNAME}
spring.datasource.password=${RESQ_PROD_DB_PASSWORD}

spring.data.redis.host=${RESQ_PROD_REDIS_HOST}
spring.data.redis.port=${RESQ_PROD_REDIS_PORT}

spring.rabbitmq.host=${RESQ_PROD_RABBITMQ_HOST}
spring.rabbitmq.port=${RESQ_PROD_RABBITMQ_PORT}
spring.rabbitmq.username=${RESQ_PROD_RABBITMQ_USERNAME}
spring.rabbitmq.password=${RESQ_PROD_RABBITMQ_PASSWORD}

resq.jwt.secret-base64=${RESQ_PROD_JWT_SECRET_BASE64}
