spring.application.name=resq
server.port=8080

# 仅连接本机 resq，允许环境变量覆盖。账号与密码必须由运行环境提供。
spring.datasource.url=${RESQ_DB_URL:jdbc:mysql://localhost:3306/resq?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai}
spring.datasource.username=${RESQ_DB_USERNAME}
spring.datasource.password=${RESQ_DB_PASSWORD}

# Day11 只读现有表；禁止启动时自动执行 schema.sql/data.sql。
spring.sql.init.mode=never

# Day13: XML Mapper exercises (SQL/resultMap are TODO).
mybatis.mapper-locations=classpath:mapper/*.xml
